name: AgriCompass
options:
  bundleIdPrefix: app.agricompass
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  AgriCompass:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AgriCompass
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: AgriCompass/Resources
    info:
      path: AgriCompass/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: CanvasColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CFBundleDisplayName: アグリコンパス
        UIAppFonts: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.agricompass.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ForestColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: アグリコンパス
  AgriCompassTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AgriCompassTests
    dependencies:
      - target: AgriCompass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.agricompass.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AgriCompass.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AgriCompass
schemes:
  AgriCompass:
    build:
      targets:
        AgriCompass: all
        AgriCompassTests: [test]
    test:
      targets:
        - AgriCompassTests
      gatherCoverageData: false
